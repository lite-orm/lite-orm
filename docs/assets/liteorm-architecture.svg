<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="title description">
  <title id="title">LiteORM compile-time SQL Mapper architecture</title>
  <desc id="description">LiteORM compiles Mapper sources and JDBC mapping policy into ordinary Java Mapper implementations. At runtime application services call generated Mappers, which create immutable execution plans and execute them through one fixed JDBC lifecycle. Standalone and Spring integrations own assembly and transaction participation without replacing JDBC execution.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4263eb"/>
    </marker>
    <filter id="paper" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .ink { stroke: #344054; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .rough { filter: url(#paper); }
      .box { fill: #ffffff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 700; fill: #101828; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #667085; }
      .phase { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1.7px; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #101828; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475467; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #475467; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #344054; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #344054; }
      .flow { fill: none; stroke: #344054; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-dark); }
      .compile-flow { fill: none; stroke: #4263eb; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .optional { fill: none; stroke: #667085; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#arrow-dark); }
    </style>
  </defs>

