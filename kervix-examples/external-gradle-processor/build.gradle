plugins {
    id 'java'
}

group = 'io.github.kervix.it'
version = '1.0.0'

repositories {
    mavenLocal()
}

dependencies {
    implementation 'io.github.kervix:kervix-core:1.0.0-SNAPSHOT'
    annotationProcessor 'io.github.kervix:kervix-processor:1.0.0-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-proc:full',
        '-processor', 'io.github.kervix.compile.KervixProcessor'
    ]
}
