name: Database matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  postgres-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL and MySQL database contracts
        run: mvn --batch-mode --no-transfer-progress test
      - name: Reject missing or skipped database contracts
        run: scripts/verify-database-test-matrix.sh
      - name: Verify PostgreSQL types artifact boundaries
        run: scripts/verify-postgresql-types-dependencies.sh
      - name: Verify MySQL types artifact boundaries
        run: scripts/verify-mysql-types-dependencies.sh
