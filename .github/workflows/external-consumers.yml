name: External consumers

on:
  pull_request:
  workflow_dispatch:

jobs:
  maven-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify external Maven consumer
        run: mvn --batch-mode --no-transfer-progress -pl lite-orm-core -am install
      - name: Verify external Gradle consumer
        run: gradle -p lite-orm-examples/external-gradle-processor --no-daemon clean build
