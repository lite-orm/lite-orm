name: External consumers

on:
  pull_request:
  workflow_dispatch:

jobs:
  maven-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify external Maven consumer
        run: |
          for attempt in 1 2 3; do
            mvn --batch-mode --no-transfer-progress -DskipTests -pl lite-orm-processor -am install && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Verify external Gradle consumer
        run: gradle -p lite-orm-examples/external-gradle-processor --no-daemon clean build
