# LiteORM configuration example

lite-orm:
  # Enables LiteORM auto-configuration. Defaults to true.
  enabled: true
  
  # Slow-query threshold in milliseconds. Defaults to 1000.
  slow-query-threshold: 1000
  
  # Enables SQL logging. Defaults to true.
  sql-logging: true
  
  # Logs parameter values. Defaults to true.
  log-parameters: true
  
  # Enables SQL auditing. Defaults to false.
  audit-enabled: false
  
  # Runs auditing asynchronously. Defaults to true.
  audit-async: true
  
  # Each Mapper package must bind to one Spring DataSource bean.
  mapper-bindings:
    - package-name: com.example.mapper
      data-source: dataSource
